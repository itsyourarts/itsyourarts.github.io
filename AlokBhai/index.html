<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05010f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Happy Birthday Alok 🎉</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Birthday song (external MP3 in assets/, plays on click) -->
  <audio id="song" preload="auto" loop src="assets/birthdaysong.mp3"></audio>
  <div class="stars" id="stars"></div>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="card">
    <div class="pfp-wrap">
      <span class="ring-pulse"></span>
      <img class="pfp" src="assets/alok.jpg" alt="Alok">
    </div>
    <div class="small">✦ Wishing you the best ✦</div>
    <h1>HAPPY BIRTHDAY</h1>
    <div class="name">Alok Bhai</div>
    <img class="cake-img" src="assets/cake.jpg" alt="Birthday cake">
    <p class="msg">
      "Another year older, another year brighter."<br>
      May this year bring you endless happiness, success, and
      bright memories. Stay awesome, stay shining, Alok Bhai! ✨
    </p>
    <button class="btn">✨ Let's Party ✨</button>
    <div class="hearts">💜 💙 💖 💛 💚</div>
  </div>
<script src="script.js"></script>
</body>
</html>
