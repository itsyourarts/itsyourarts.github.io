
<div class="wrap">
  <h1>View Booster v2 <span id="ver" class="pill">JS load nahi hua</span></h1>
  <p class="sub">API ko seedha call karta hai — video play karne ki zaroorat nahi. Bohot tez.</p>

  <div class="card">
    <div class="field">
      <label>Video page URL</label>
      <input id="url" type="text" spellcheck="false" value="https://yourstream.pages.dev/v/4748cd651a873c87f6399cef">
    </div>
    <div class="row">
      <div class="field"><label>Kitne views</label><input type="number" min="0" value="200"></div>
      <div class="field"><label>Parallel</label><input id="conc" type="number" min="1" max="20" value="4"></div>
      <div class="field"><label>Gap (ms)</label><input id="delay" type="number" min="0" step="50" value="0"></div>
    </div>
    <label class="chk"><input id="cred" type="checkbox" checked=""> Cookies bhejo (credentials: include)</label>
    <div class="btns">
      <button id="diag">API test</button>
      <button id="one">Test 1 view</button>
      <button id="start" class="primary">Start</button>
      <button id="stop" disabled="">Stop</button>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="stats">
      <div class="stat"><b id="done">0</b><span>Views added</span></div>
      <div class="stat"><b id="err">0</b><span>Errors</span></div>
      <div class="stat"><b id="rate">0</b><span>Per min</span></div>
      <div class="stat"><b id="views">—</b><span>Abhi views</span></div>
    </div>
    <div class="log" id="log"></div>
    <p class="hint">API endpoints: <code>GET /api/play/{id}</code> → viewToken, phir <code>POST /api/view/{id}?t=token</code>.
    Pehle <b>API test</b> dabao — green aaya to Start dabao.</p>
  </div>
</div>
