<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ItsYourArts personal project hub" />
  <title>ItsYourArts | Project Hub</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #eafcff;
      font-family: Inter, Arial, sans-serif;
      background: radial-gradient(circle at 20% 20%, #14285c, transparent 38%),
                  radial-gradient(circle at 80% 80%, #4a123e, transparent 36%), #050711;
    }
    main {
      width: min(760px, 100%);
      padding: clamp(28px, 6vw, 60px);
      text-align: center;
      border: 1px solid rgba(0, 240, 255, .45);
      border-radius: 24px;
      background: rgba(8, 15, 35, .82);
      box-shadow: 0 0 45px rgba(0, 240, 255, .16), inset 0 0 35px rgba(255, 0, 160, .06);
    }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 7vw, 4.5rem); color: #00f0ff; text-shadow: 0 0 18px #00f0ff88; }
    p { color: #a9c9d0; line-height: 1.6; }
    .links { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-top: 30px; }
    a { padding: 15px 18px; border: 1px solid #00f0ff88; border-radius: 12px; color: #eafcff; text-decoration: none; background: #00f0ff12; transition: .2s ease; }
    a:hover { transform: translateY(-3px); border-color: #00f0ff; box-shadow: 0 0 20px #00f0ff55; }
    small { display: block; margin-top: 30px; color: #6f8d96; }
  </style>
</head>
<body>
  <main>
    <h1>ItsYourArts</h1>
    <p>Welcome to my personal project hub.</p>
    <div class="links">
      <a href="./Editor/">⚡ PDF Editor</a>
      <a href="./Ai/">🤖 Neon AI</a>
      <a href="./Typing/">⌨️ Typing</a>
      <a href="./Codes/">💻 Coding Practice</a>
    </div>
    <small>Personal projects by ItsYourArts</small>
  </main>
</body>
</html>
