
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOUCHED BY GODXSHADOW</title>

<!-- FUTURISTIC FONT -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --red:#ff003c;
  --cyan:#00eaff;
  --bone:#e8e4dc;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  height:100%;
  overflow:hidden;
  background:#000;
}

body{
  font-family:"Courier New",monospace;
  color:var(--bone);
  cursor:none;
  -webkit-font-smoothing:antialiased;
}

/* BACKGROUND */

.bg-stack{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
}

.bg-stack img{
  position:absolute;
  inset:-6%;
  width:112%;
  height:112%;
  object-fit:cover;
  will-change:transform,filter;
}

.bg-stack .l1{
  filter:contrast(1.35) brightness(.42) saturate(.6);
  animation:breath 9s ease-in-out infinite,hardjump 5.5s steps(1) infinite;
}

.bg-stack .l2{
  filter:brightness(.5) sepia(1) hue-rotate(-25deg) saturate(6);
  mix-blend-mode:screen;
  opacity:.55;
  animation:splitA .42s steps(2) infinite;
}

.bg-stack .l3{
  filter:brightness(.5) sepia(1) hue-rotate(150deg) saturate(6);
  mix-blend-mode:screen;
  opacity:.5;
  animation:splitB .33s steps(2) infinite;
}

@keyframes breath{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.07)}
}

@keyframes hardjump{
  0%,88%{transform:translate(0,0)}
  89%{transform:translate(-14px,6px) scale(1.02)}
  91%{transform:translate(11px,-9px)}
  93%{transform:translate(0,0)}
}

@keyframes splitA{
  0%{transform:translate(-7px,0)}
  50%{transform:translate(5px,2px)}
  100%{transform:translate(-3px,-2px)}
}

@keyframes splitB{
  0%{transform:translate(6px,-2px)}
  50%{transform:translate(-6px,1px)}
  100%{transform:translate(3px,2px)}
}

/* CRT EFFECTS */

.scan{
  position:fixed;
  inset:0;
  z-index:6;
  pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,.42) 0px,
    rgba(0,0,0,.42) 1px,
    transparent 1px,
    transparent 3px
  );
  mix-blend-mode:multiply;
  animation:scanroll 7s linear infinite;
}

@keyframes scanroll{
  to{background-position-y:120px}
}

.sweep{
  position:fixed;
  left:0;
  right:0;
  height:26vh;
  z-index:7;
  pointer-events:none;
  background:linear-gradient(
    to bottom,
    transparent,
    rgba(255,0,60,.10),
    rgba(0,234,255,.10),
    transparent
  );
  animation:sweep 6.5s linear infinite;
  mix-blend-mode:screen;
}

@keyframes sweep{
  0%{top:-30vh}
  100%{top:105vh}
}

.noise{
  position:fixed;
  inset:-50%;
  z-index:8;
  pointer-events:none;
  opacity:.16;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
  animation:noiseShift .12s steps(1) infinite;
  mix-blend-mode:overlay;
}

@keyframes noiseShift{
  0%{transform:translate(0,0)}
  25%{transform:translate(-2%,1%)}
  50%{transform:translate(1%,-2%)}
  75%{transform:translate(-1%,-1%)}
  100%{transform:translate(2%,2%)}
}

.vignette{
  position:fixed;
  inset:0;
  z-index:9;
  pointer-events:none;
  background:radial-gradient(
    ellipse at center,
    transparent 40%,
    rgba(0,0,0,.85) 100%
  );
}

#rain{
  position:fixed;
  inset:0;
  z-index:5;
  pointer-events:none;
  opacity:.35;
}

#mosh{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
  overflow:hidden;
}

.blk{
  position:absolute;
  mix-blend-mode:screen;
}

/* MAIN CONTENT */

.core{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:0 5vw;
  animation:corejit 3.4s steps(1) infinite;
}

@keyframes corejit{
  0%,92%{transform:translate(0,0)}
  94%{transform:translate(-6px,3px) skewX(-.6deg)}
  96%{transform:translate(5px,-4px)}
  98%{transform:translate(0,0)}
}

.kicker{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(9px,1.5vw,14px);
  letter-spacing:.4em;
  text-transform:uppercase;
  color:var(--cyan);
  text-shadow:0 0 12px var(--cyan);
  margin-bottom:1.2rem;
  animation:blink 1.1s steps(1) infinite;
}

@keyframes blink{
  0%,60%{opacity:1}
  61%,100%{opacity:.25}
}

/* UPDATED FUTURISTIC FONT */

.glitch{
  position:relative;
  display:block;
  font-family:'Orbitron',sans-serif;
  font-weight:900;
  line-height:1.08;
  letter-spacing:.025em;
  text-transform:uppercase;
  white-space:nowrap;
  -webkit-font-smoothing:antialiased;
}

.glitch::before,
.glitch::after{
  content:attr(data-text);
  position:absolute;
  left:0;
  top:0;
  width:100%;
  pointer-events:none;
  font-family:'Orbitron',sans-serif;
  font-weight:900;
}

.glitch::before{
  color:var(--red);
  clip-path:inset(0 0 52% 0);
  animation:gA 1.9s steps(2) infinite;
  text-shadow:0 0 18px rgba(255,0,60,.7);
}

.glitch::after{
  color:var(--cyan);
  clip-path:inset(52% 0 0 0);
  animation:gB 1.45s steps(2) infinite;
  text-shadow:0 0 18px rgba(0,234,255,.7);
}

@keyframes gA{
  0%{transform:translate(-4px,-2px)}
  30%{transform:translate(6px,1px);clip-path:inset(0 0 62% 0)}
  55%{transform:translate(-8px,2px);clip-path:inset(10% 0 40% 0)}
  80%{transform:translate(3px,-1px)}
  100%{transform:translate(-4px,-2px)}
}

@keyframes gB{
  0%{transform:translate(5px,2px)}
  35%{transform:translate(-7px,-2px);clip-path:inset(45% 0 0 0)}
  60%{transform:translate(9px,1px);clip-path:inset(70% 0 0 0)}
  85%{transform:translate(-3px,2px)}
  100%{transform:translate(5px,2px)}
}

h1.glitch{
  font-size:clamp(25px,6.5vw,82px);
  color:#fff;
  text-shadow:0 0 30px rgba(255,255,255,.28);
}

h2.glitch{
  font-size:clamp(28px,9.5vw,130px);
  color:#fff;
  margin-top:.16em;
  letter-spacing:.035em;
  text-shadow:0 0 40px rgba(255,0,60,.45);
}

.sub{
  margin-top:1.6rem;
  font-size:clamp(10px,1.5vw,15px);
  letter-spacing:.28em;
  text-transform:uppercase;
  color:#9aa0a6;
}

.stats{
  margin-top:2rem;
  display:flex;
  flex-wrap:wrap;
  gap:.6rem 1.4rem;
  justify-content:center;
  font-size:clamp(8px,1.1vw,11px);
  letter-spacing:.18em;
  color:#6d7378;
  text-transform:uppercase;
}

.stats span b{
  color:var(--red);
  font-weight:700;
}

/* TICKERS */

.ticker{
  position:fixed;
  left:0;
  right:0;
  z-index:25;
  background:var(--red);
  color:#000;
  font-size:clamp(9px,1.3vw,13px);
  font-weight:700;
  letter-spacing:.3em;
  text-transform:uppercase;
  padding:.45rem 0;
  overflow:hidden;
  white-space:nowrap;
  mix-blend-mode:screen;
}

.ticker.top{
  top:0;
  animation:tk .0s;
}

.ticker.bottom{
  bottom:0;
  background:var(--cyan);
  animation:tk2 22s linear infinite;
}

.ticker .run{
  display:inline-block;
  animation:tk 18s linear infinite;
}

.ticker.bottom .run{
  animation:tkrev 26s linear infinite;
}

@keyframes tk{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}

@keyframes tkrev{
  from{transform:translateX(-50%)}
  to{transform:translateX(0)}
}

/* BOOT SCREEN */

.boot{
  position:fixed;
  inset:0;
  z-index:60;
  background:#000;
  padding:6vh 6vw;
  font-size:clamp(10px,1.6vw,15px);
  line-height:1.75;
  color:#37ff7a;
  text-shadow:0 0 8px rgba(55,255,122,.6);
  overflow:hidden;
}

.boot .ok{
  color:var(--cyan);
}

.boot .warn{
  color:var(--red);
}

.boot.done{
  opacity:0;
  transition:opacity .45s;
  pointer-events:none;
}

.caret{
  display:inline-block;
  width:.6em;
  height:1em;
  background:#37ff7a;
  vertical-align:-.15em;
  animation:blink .8s steps(1) infinite;
}

/* CURSOR */

#cur{
  position:fixed;
  z-index:99;
  width:14px;
  height:14px;
  pointer-events:none;
  border:1px solid var(--red);
  transform:translate(-50%,-50%);
  mix-blend-mode:screen;
}

.trail{
  position:fixed;
  z-index:98;
  width:4px;
  height:4px;
  pointer-events:none;
  background:var(--cyan);
  transform:translate(-50%,-50%);
  mix-blend-mode:screen;
}

/* MOBILE */

@media(max-width:640px){
  .stats{
    display:none;
  }

  .core{
    justify-content:center;
  }

  h1.glitch{
    font-size:clamp(23px,7vw,46px);
  }

  h2.glitch{
    font-size:clamp(25px,9vw,58px);
    letter-spacing:0;
  }

  .kicker{
    letter-spacing:.25em;
  }
}
</style>
</head>

<body>

<canvas id="rain"></canvas>

<div class="bg-stack">
  <img class="l1" src="https://raw.githubusercontent.com/itsyourarts/Files/main/Files/GodxShadow_HuggingFace_Enhanced_4K.png" alt="">
  <img class="l2" src="https://raw.githubusercontent.com/itsyourarts/Files/main/Files/GodxShadow_HuggingFace_Enhanced_4K.png" alt="">
  <img class="l3" src="https://raw.githubusercontent.com/itsyourarts/Files/main/Files/GodxShadow_HuggingFace_Enhanced_4K.png" alt="">
</div>

<div class="scan"></div>
<div class="sweep"></div>
<div class="noise"></div>
<div class="vignette"></div>
<div id="mosh"></div>

<div class="ticker top">
  <span class="run" id="tkA"></span>
</div>

<div class="ticker bottom">
  <span class="run" id="tkB"></span>
</div>

<main class="core">

  <div class="kicker">// system compromised //</div>

  <h1 class="glitch" data-text="TOUCHED BY">
    TOUCHED BY
  </h1>

  <h2 class="glitch" data-text="GODXSHADOW" id="name">
    GODXSHADOW
  </h2>

  <p class="sub">security was a suggestion</p>

  <div class="stats">
    <span>user <b>root</b></span>
    <span>shell <b>pwned</b></span>
    <span>nodes <b id="n1">0</b></span>
    <span>uptime <b id="n2">00:00</b></span>
    <span>trace <b>none</b></span>
  </div>

</main>

<div class="boot" id="boot"></div>
<div id="cur"></div>

<script>
(() => {

  const $ = s => document.querySelector(s);
  const rnd = (a,b) => a + Math.random()*(b-a);
  const pick = a => a[Math.floor(Math.random()*a.length)];

  /* TICKER */

  const line = 'TOUCHED BY GODXSHADOW ✦ SYSTEM OWNED ✦ SECURITY WAS A SUGGESTION ✦ ';
  const fill = line.repeat(8);

  $('#tkA').textContent = fill + fill;
  $('#tkB').textContent = fill + fill;

  /* BOOT SEQUENCE */

  const boot = $('#boot');

  const seq = [
    ['[  OK  ] mounting /dev/soul', 'ok'],
    ['[  OK  ] bypassing auth layer', 'ok'],
    ['[  OK  ] injecting payload -> 0x1A4F', 'ok'],
    ['[ WARN ] firewall: ignored', 'warn'],
    ['[  OK  ] escalating privileges', 'ok'],
    ['[  OK  ] dumping credentials', 'ok'],
    ['[ WARN ] trace attempt: dropped', 'warn'],
    ['[  OK  ] root shell acquired', 'ok'],
    ['', ''],
    ['  >>> TOUCHED BY GODXSHADOW <<<', 'warn'],
  ];

  let li = 0;

  const caret = document.createElement('span');
  caret.className = 'caret';

  const lineEl = document.createElement('div');
  boot.appendChild(lineEl);
  lineEl.appendChild(caret);

  function step(){

    if(li >= seq.length){
      setTimeout(finishBoot,480);
      return;
    }

    const [txt,cls] = seq[li++];
    const d = document.createElement('div');

    if(cls) d.className = cls;

    d.textContent = txt;
    boot.insertBefore(d,lineEl);

    caret.style.display = 'inline-block';

    setTimeout(step,rnd(90,210));
  }

  function finishBoot(){

    if(boot.classList.contains('done')) return;

    boot.classList.add('done');

    setTimeout(()=>{
      boot.style.display='none';
    },500);

    scramble($('#name'),'GODXSHADOW');
    buzz();
  }

  setTimeout(step,250);

  document.addEventListener('click',function skip(){

    if(!boot.classList.contains('done')){
      finishBoot();
    }

  },{once:true});

  /* SCRAMBLE TEXT */

  const GLYPHS = '!<>-_\\/[]{}—=+*^?#________ÀÁÂÃÄÅ01';

  function scramble(el,final){

    let frame = 0;
    const total = final.length * 4;

    const id = setInterval(()=>{

      frame++;

      el.textContent = final.split('').map((c,i)=>{

        if(c === ' ') return ' ';

        if(frame > total-(i*3)) return c;

        return Math.random()<.35 ? c : pick(GLYPHS);

      }).join('');

      if(frame > total){

        clearInterval(id);

        el.textContent = final;
        el.setAttribute('data-text',final);

      }

    },42);
  }

  /* DATAMOSH */

  const mosh = $('#mosh');

  const COLORS = [
    'rgba(255,0,60,.55)',
    'rgba(0,234,255,.5)',
    'rgba(255,255,255,.4)',
    'rgba(0,0,0,.8)'
  ];

  setInterval(()=>{

    const n = Math.random()<.3 ? 3 : 1;

    for(let i=0;i<n;i++){

      const b = document.createElement('div');

      b.className = 'blk';

      b.style.left = rnd(-2,100)+'vw';
      b.style.top = rnd(0,100)+'vh';
      b.style.width = rnd(4,45)+'vw';
      b.style.height = rnd(1,7)+'vh';
      b.style.background = pick(COLORS);

      b.style.transform = `translateX(${rnd(-8,8)}px)`;

      if(Math.random()<.18){
        b.style.filter='invert(1)';
      }

      mosh.appendChild(b);

      setTimeout(()=>{
        b.remove();
      },rnd(80,190));

    }

  },85);

  /* MATRIX RAIN */

  const cv = $('#rain');
  const ctx = cv.getContext('2d');

  let cols = [], W = 0, H = 0;

  const CHARS = 'アイウエオカキクケコサシスセソ01<>/\\|$#@%&';

  function size(){

    W = cv.width = innerWidth;
    H = cv.height = innerHeight;

    cols = Array.from(
      {length:Math.floor(W/16)},
      ()=>Math.random()*H
    );

  }

  size();

  addEventListener('resize',size);

  function rain(){

    ctx.fillStyle='rgba(0,0,0,.09)';
    ctx.fillRect(0,0,W,H);

    ctx.font='14px monospace';

    for(let i=0;i<cols.length;i++){

      const ch = CHARS[Math.floor(Math.random()*CHARS.length)];

      ctx.fillStyle = Math.random()<.06 ? '#00eaff' : '#ff003c';

      ctx.fillText(ch,i*16,cols[i]);

      cols[i]+=16;

      if(cols[i]>H && Math.random()>.975){
        cols[i]=0;
      }

    }

    requestAnimationFrame(rain);
  }

  rain();

  /* TITLE GLITCH */

  const REAL = 'TOUCHED BY GODXSHADOW';

  setInterval(()=>{

    document.title = Math.random()<.5
      ? REAL
      : REAL.split('').map(c=>
          c===' ' ? ' ' : (Math.random()<.4 ? pick(GLYPHS) : c)
        ).join('');

  },160);

  /* COUNTERS */

  let nodes = 1337, t = 0;

  setInterval(()=>{

    nodes += Math.floor(rnd(1,40));

    $('#n1').textContent = nodes;

    t++;

    $('#n2').textContent =
      String(Math.floor(t/60)).padStart(2,'0') +
      ':' +
      String(t%60).padStart(2,'0');

  },1000);

  /* CURSOR + TRAIL */

  const cur = $('#cur');

  addEventListener('mousemove',e=>{

    cur.style.left = e.clientX+'px';
    cur.style.top = e.clientY+'px';

    const tr = document.createElement('div');

    tr.className='trail';

    tr.style.left=e.clientX+'px';
    tr.style.top=e.clientY+'px';

    document.body.appendChild(tr);

    setTimeout(()=>{
      tr.remove();
    },320);

  });

  /* AUDIO BUZZ */

  let actx = null;

  function buzz(){

    try{

      actx = actx || new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

      const o = actx.createOscillator();
      const g = actx.createGain();
      const f = actx.createBiquadFilter();

      o.type='sawtooth';

      o.frequency.setValueAtTime(180,actx.currentTime);

      o.frequency.exponentialRampToValueAtTime(
        45,
        actx.currentTime+.55
      );

      f.type='lowpass';
      f.frequency.value=1400;

      g.gain.setValueAtTime(.14,actx.currentTime);

      g.gain.exponentialRampToValueAtTime(
        .001,
        actx.currentTime+.6
      );

      o.connect(f);
      f.connect(g);
      g.connect(actx.destination);

      o.start();
      o.stop(actx.currentTime+.62);

    }catch(e){}

  }

  document.addEventListener('click',buzz);

  /* RANDOM INVERT FLASH */

  setInterval(()=>{

    if(Math.random()>.72){

      document.documentElement.style.filter =
        'invert(1) hue-rotate(90deg)';

      setTimeout(()=>{
        document.documentElement.style.filter='';
      },rnd(45,110));

    }

  },2400);

})();
</script>

</body>
</html>
