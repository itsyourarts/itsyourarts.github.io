<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GENZO API Tools</title>
<style>
  :root{--p:#4f46e5;--p2:#06b6d4;--bg:#f4f7fb;--tx:#0f172a;--gr:#64748b;--lt:#94a3b8;
        --ok:#059669;--err:#b91c1c}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx);
       min-height:100vh;display:flex;flex-direction:column;align-items:center;
       background-image:radial-gradient(circle at 50% -15%,#e0e7ff,var(--bg) 60%);padding:22px 14px 50px}
  .wrap{max-width:560px;width:100%}
  h1{text-align:center;font-size:1.45rem;font-weight:800;margin-bottom:16px}
  h1 span{background:linear-gradient(135deg,var(--p),var(--p2));-webkit-background-clip:text;
          background-clip:text;-webkit-text-fill-color:transparent}
  .tabs{display:flex;gap:6px;background:#fff;padding:6px;border-radius:100px;
        box-shadow:0 8px 22px -8px rgba(15,23,42,.18);margin-bottom:16px}
  .tab{flex:1;padding:10px 4px;border:0;border-radius:100px;background:transparent;cursor:pointer;
       font-weight:700;font-size:.82rem;color:var(--gr);transition:.2s}
  .tab.on{background:linear-gradient(135deg,var(--p),#3b82f6);color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.35)}
  .panel{display:none}.panel.on{display:block;animation:up .25s ease}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .bar{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #fff;
       padding:6px 6px 6px 16px;border-radius:100px;box-shadow:0 10px 28px -10px rgba(15,23,42,.2)}
  .pfx{font-family:monospace;font-weight:700;padding-right:8px;border-right:2px solid #e2e8f0}
  .bar input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:11px 4px;
             font-size:.95rem;font-weight:600;text-transform:uppercase}
  .bar input::placeholder{text-transform:none;color:var(--lt)}
  .go{border:0;background:linear-gradient(135deg,var(--p),#3b82f6);color:#fff;font-weight:700;
      padding:10px 20px;border-radius:100px;cursor:pointer;font-size:.85rem;
      box-shadow:0 4px 14px rgba(79,70,229,.35);white-space:nowrap}
  .go:disabled{opacity:.55;cursor:not-allowed}
  .log{margin-top:14px;background:#0b1120;border:1px solid #1e293b;border-radius:12px;
       padding:12px;font:600 .72rem/1.7 monospace;color:#38bdf8;white-space:pre-wrap}
  .out{margin-top:16px;display:flex;flex-direction:column;gap:8px}
  .card{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;
        border:1px solid #eef2f7;border-radius:12px;padding:11px 14px;box-shadow:0 2px 6px rgba(0,0,0,.03)}
  .card.hi{background:#f0fdf4;border-color:#a7f3d0}.card.hi .v{color:var(--ok)}
  .k{font-size:.62rem;font-weight:700;color:var(--gr);text-transform:uppercase;letter-spacing:.5px}
  .v{font-size:.9rem;font-weight:600;word-break:break-word;line-height:1.4}
  .v.mono{font-family:monospace}
  .cp{border:1px solid #e2e8f0;background:#f8fafc;color:var(--gr);width:30px;height:30px;
      border-radius:7px;cursor:pointer;flex-shrink:0}
  .cp:hover{background:var(--p);color:#fff}
  .sec{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--tx);margin:12px 0 0 4px}
  .err{margin-top:14px;background:#fee2e2;color:var(--err);border:1px solid #fecaca;
       border-radius:12px;padding:12px 14px;font-weight:600;font-size:.84rem;white-space:pre-wrap}
  .hide{display:none!important}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;
         padding:10px 20px;border-radius:100px;font-size:.82rem;font-weight:600;z-index:9}
</style>
</head>
<body>
<div class="wrap">
  <h1>GENZO <span>OSINT Tools</span></h1>

  <div class="tabs">
    <button class="tab on" data-t="num">Number</button>
    <button class="tab" data-t="veh">Vehicle</button>
    <button class="tab" data-t="fam">Family</button>
  </div>

  <section class="panel on" id="p-num">
    <div class="bar">
      <span class="pfx">+91</span>
      <input id="i-num" placeholder="10 digit mobile" maxlength="10" inputmode="numeric">
      <button class="go" id="b-num">Track</button>
    </div>
    <div class="log hide" id="l-num"></div>
    <div class="out hide" id="o-num"></div>
    <div class="err hide" id="e-num"></div>
  </section>

  <section class="panel" id="p-veh">
    <div class="bar">
      <input id="i-veh" placeholder="vehicle number e.g. DL01AB1234">
      <button class="go" id="b-veh">Scan</button>
    </div>
    <div class="log hide" id="l-veh"></div>
    <div class="out hide" id="o-veh"></div>
    <div class="err hide" id="e-veh"></div>
  </section>

  <section class="panel" id="p-fam">
    <div class="bar">
      <input id="i-fam" placeholder="12 digit aadhaar" maxlength="12" inputmode="numeric">
      <button class="go" id="b-fam">Map</button>
    </div>
    <div class="log hide" id="l-fam"></div>
    <div class="out hide" id="o-fam"></div>
    <div class="err hide" id="e-fam"></div>
  </section>
</div>

<script>
const API = "https://userinfo.site/freeosint/api.php";
const el  = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

/* ---------- tabs ---------- */
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
  document.querySelectorAll(".panel").forEach(x => x.classList.remove("on"));
  t.classList.add("on");
  el("p-" + t.dataset.t).classList.add("on");
});

/* ---------- helpers ---------- */
function card(label, val, o){
  o = o || {};
  if(val==null || val==="" || val==="N/A" || val==="null") return "";
  return '<div class="card'+(o.hi?' hi':'')+'"><div><div class="k">'+esc(label)+
         '</div><div class="v'+(o.mono?' mono':'')+'">'+esc(val)+
         '</div></div><button class="cp" data-c="'+esc(val)+'">&#10064;</button></div>';
}
const sec = t => '<div class="sec">'+esc(t)+'</div>';

document.addEventListener("click", e => {
  const b = e.target.closest(".cp");
  if(b) navigator.clipboard.writeText(b.dataset.c).then(()=>toast("Copied!"));
});
function toast(m){
  const d = document.createElement("div");
  d.className = "toast"; d.textContent = m;
  document.body.appendChild(d); setTimeout(()=>d.remove(), 1500);
}

/* ---------- API call with fallbacks ---------- */
async function apiCall(action, payload){
  const target = API + "?action=" + action;
  const endpoints = [
    ["direct",      target],
    ["allorigins",  "https://api.allorigins.win/raw?url="  + encodeURIComponent(target)],
    ["corsproxy",   "https://corsproxy.io/?url="            + encodeURIComponent(target)],
    ["codetabs",    "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(target)],
    ["thingproxy",  "https://thingproxy.freeboard.io/fetch/" + target]
  ];
  let lastErr = null;
  for(const [name, url] of endpoints){
    try{
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const txt = await res.text();
      let json;
      try { json = JSON.parse(txt); }
      catch(_) { throw new Error("non-JSON: " + txt.replace(/\s+/g," ").slice(0,90)); }
      return { json, via: name };
    } catch(err){ lastErr = err; }
  }
  throw lastErr || new Error("all endpoints failed");
}

/* ---------- generic runner ---------- */
async function fire(cfg){
  const input = el(cfg.input);
  const val = cfg.clean(input.value);
  if(!cfg.valid(val)){ alert(cfg.hint); return; }

  const out = el(cfg.out), log = el(cfg.log), err = el(cfg.err), btn = el(cfg.btn);
  out.classList.add("hide"); err.classList.add("hide");
  log.classList.remove("hide");
  log.textContent = "$ POST api.php?action=" + cfg.action + "\n~ target: " + val + "\n~ contacting server...";
  btn.disabled = true; const old = btn.textContent; btn.textContent = "...";

  try{
    const { json, via } = await apiCall(cfg.action, cfg.payload(val));
    log.textContent += "\n~ reply received via [" + via + "]";
    const ok = (json.success === true || json.success === "true" || json.data != null);
    if(!ok) throw new Error(json.error || "No record found");
    log.textContent += "\n~ [SUCCESS] parsing data";
    out.innerHTML = cfg.render(json.data != null ? json.data : json, val);
    out.classList.remove("hide");
    setTimeout(()=>log.classList.add("hide"), 900);
  } catch(e){
    log.classList.add("hide");
    err.textContent = "⚠ " + e.message;
    err.classList.remove("hide");
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
}

/* ---------- configs ---------- */
const CFG = {
  num: {
    input:"i-num", btn:"b-num", log:"l-num", out:"o-num", err:"e-num",
    action:"lookup", clean:v=>v.replace(/\D/g,""), valid:v=>v.length===10,
    hint:"Enter valid 10-digit number", payload:v=>({number:v}),
    render:(d,q)=>{
      const arr = Array.isArray(d) ? d : [d];
      return arr.map((r,i)=> (arr.length>1 ? sec("Record "+(i+1)) : "") +
        card("Full Name", r.name||r.Name) +
        card("Mobile", r.mobile||r.Mobile||q, {mono:true}) +
        card("Aadhaar Number", r.aadhaar||r.id||r.aadhar, {mono:true, hi:true}) +
        card("Father Name", r.fname||r["Father Name"]) +
        card("Address", r.formatted_address||r.address||r.Address) +
        card("Circle", r.circle||r.Circle) +
        card("Alternate", r.alt||r.alternate) +
        card("Email", r.email||r.Email)
      ).join("");
    }
  },
  veh: {
    input:"i-veh", btn:"b-veh", log:"l-veh", out:"o-veh", err:"e-veh",
    action:"vehicle", clean:v=>v.toUpperCase().replace(/\s+/g,""), valid:v=>v.length>=6,
    hint:"Enter vehicle number", payload:v=>({vehicle_num:v}),
    render:d=> card("Registration No.", d.registration_number||d.vehicle_number, {mono:true,hi:true}) +
      card("Owner Name", d.owner_name) +
      card("Mobile", d.mobile_number, {mono:true,hi:true}) +
      card("RTO", d.rto) + card("RC Status", d.rc_status) +
      sec("Vehicle") +
      card("Manufacturer", d.manufacturer) + card("Model", d.vehicle) +
      card("Variant", d.variant) + card("Class", d.vehicle_class) +
      card("Fuel", d.fuel_type) + card("Engine CC", d.cubic_capacity) +
      sec("Validity") +
      card("Registration Date", d.registration_date, {mono:true}) +
      card("Insurance Upto", d.insurance_upto, {mono:true}) +
      card("PUCC Upto", d.pucc_valid_upto, {mono:true}) +
      sec("Identifiers") +
      card("Chassis No.", d.chassis_number, {mono:true}) +
      card("Engine No.", d.engine_number, {mono:true})
  },
  fam: {
    input:"i-fam", btn:"b-fam", log:"l-fam", out:"o-fam", err:"e-fam",
    action:"family", clean:v=>v.replace(/\D/g,""), valid:v=>v.length===12,
    hint:"Enter 12-digit aadhaar", payload:v=>({id_number:v}),
    render:d=>{
      const m = d.members || [];
      return card("Ration Card No.", d.ration_card_number||d.rcId, {mono:true,hi:true}) +
        card("Head of Family", d.head_of_family||d.head) +
        card("Scheme", d.scheme) + card("State", d.state) + card("District", d.district) +
        card("FPS / Dealer ID", d.fps_id, {mono:true}) +
        card("Total Members", d.total_members||m.length) +
        sec("Members (" + m.length + ")") +
        m.map(x => '<div class="card"><div><div class="k">'+esc(x.relation||"Member")+
          '</div><div class="v">'+esc(x.name||"Unknown")+' · <span class="mono">'+
          esc(x.member_id||"")+'</span></div></div></div>').join("");
    }
  }
};

el("b-num").onclick = () => fire(CFG.num);
el("b-veh").onclick = () => fire(CFG.veh);
el("b-fam").onclick = () => fire(CFG.fam);

[["i-num","b-num"],["i-veh","b-veh"],["i-fam","b-fam"]].forEach(([i,b]) =>
  el(i).addEventListener("keypress", e => { if(e.key==="Enter") el(b).click(); })
);
</script>
</body>
</html>
