<!DOCTYPE html>
<html>
<head>
    <title>Mobile Search</title>
</head>
<body>

<h1>Mobile Number Search</h1>

<input
    type="text"
    id="mobile"
    placeholder="Enter mobile number"
>

<button onclick="searchMobile()">Search</button>

<pre id="result"></pre>

<script>
async function searchMobile() {
    const mobile = document.getElementById("mobile").value.trim();
    const result = document.getElementById("result");

    if (!mobile) {
        result.textContent = "Please enter a mobile number.";
        return;
    }

    result.textContent = "Searching...";

    try {
        const response = await fetch(
            `https://sauravsingh2111-numinfo.hf.space/search/${encodeURIComponent(mobile)}`
        );

        const data = await response.json();

        result.textContent = JSON.stringify(data, null, 2);
    } catch (error) {
        result.textContent = "Error: " + error.message;
    }
}
</script>

</body>
</html>
