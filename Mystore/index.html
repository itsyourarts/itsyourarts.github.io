<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05070f">
<title>SHADOWSTORE — Apps &amp; Software Hub</title>
<meta name="description" content="SHADOWSTORE — Android apps (.apk) and desktop software (.exe) delivered straight from GitHub Releases.">
<style>
/* ============================================================
   SHADOWSTORE — NEON GLASS THEME
   ============================================================ */
:root{
  --bg:#05070f;
  --bg-2:#080c18;
  --text:#eef4ff;
  --muted:#8ea0bd;
  --faint:#6b7c98;

  --neon:#8bffc8;          /* mint neon */
  --neon-2:#42e8ff;        /* cyan neon */
  --neon-3:#b06bff;        /* violet neon */
  --pink:#ff6ad5;

  --glass:rgba(255,255,255,.045);
  --glass-2:rgba(255,255,255,.07);
  --glass-strong:rgba(12,18,34,.62);
  --line:rgba(255,255,255,.10);
  --line-neon:rgba(139,255,200,.35);

  --shadow:0 18px 60px rgba(0,0,0,.55);
  --glow:0 0 24px rgba(139,255,200,.30);
  --r-sm:10px;
  --r:16px;
  --r-lg:24px;
}

*{box-sizing:border-box}
html{
  scroll-behavior:smooth;
  background:var(--bg);
  color-scheme:dark;
  min-height:100%;
}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font:14px/1.6 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(1100px 700px at 8% -10%,rgba(66,232,255,.16),transparent 60%),
    radial-gradient(900px 700px at 92% 0%,rgba(176,107,255,.18),transparent 62%),
    radial-gradient(1000px 800px at 50% 120%,rgba(139,255,200,.12),transparent 60%),
    linear-gradient(180deg,#05070f,#070b16 40%,#05070f);
  background-attachment:fixed;
  background-color:#05070f;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  overflow-y:auto;
  overscroll-behavior-y:none;
  scrollbar-color:rgba(139,255,200,.8) rgba(9,13,24,.9);
}
html::-webkit-scrollbar,
body::-webkit-scrollbar{
  width:12px;
  height:12px;
}
html::-webkit-scrollbar-track,
body::-webkit-scrollbar-track{
  background:rgba(9,13,24,.92);
}
html::-webkit-scrollbar-thumb,
body::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,rgba(66,232,255,.82),rgba(139,255,200,.82));
  border:2px solid rgba(9,13,24,.92);
  border-radius:999px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
}
html::-webkit-scrollbar-thumb:hover,
body::-webkit-scrollbar-thumb:hover{
  background:linear-gradient(180deg,rgba(66,232,255,1),rgba(139,255,200,1));
}
body::before{
  content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(38% 38% at 20% 30%,rgba(66,232,255,.16),transparent 70%),
    radial-gradient(34% 34% at 80% 20%,rgba(176,107,255,.16),transparent 70%),
    radial-gradient(40% 40% at 55% 85%,rgba(139,255,200,.14),transparent 70%);
  filter:blur(20px);
  animation:drift 22s ease-in-out infinite alternate;
}
@keyframes drift{
  0%{transform:translate3d(0,0,0) scale(1)}
  100%{transform:translate3d(2%,-3%,0) scale(1.08)}
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
  background-image:
    linear-gradient(rgba(139,255,200,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(66,232,255,.055) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 78%);
}

button,input,select{font:inherit}
button,a{ -webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--neon);outline-offset:4px;border-radius:8px}
button:disabled{opacity:.45;cursor:not-allowed}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}

/* ---------- glass primitive ---------- */
.glass{
  background:linear-gradient(150deg,var(--glass-2),var(--glass));
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.12);
}
